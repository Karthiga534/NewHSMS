{% extends 'base.html' %}
{% block title %}Fee Application - HSMS{% endblock %}
{% block extra_head %}
<style>
  .content { margin-left: 0; }
  .topbar { position: static; }
</style>
{% endblock %}
{% block sidebar %}{% endblock %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Fee Application Form</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="fee_type" class="form-label">Fee Type</label>
                    <select class="form-select" id="fee_type" name="fee_type" required>
                        <option value="">Select Fee Type</option>
                        <option value="Hostel Fee">Hostel Fee</option>
                        <option value="Mess Fee">Mess Fee</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
                </div>
                <div class="mb-3">
                    <label for="payment_date" class="form-label">Payment Date</label>
                    <input type="date" class="form-control" id="payment_date" name="payment_date" required>
                </div>
                <div class="mb-3">
                    <label for="payment_method" class="form-label">Payment Method</label>
                    <select class="form-select" id="payment_method" name="payment_method" required>
                        <option value="">Select Payment Method</option>
                        <option value="Online Transfer">Online Transfer</option>
                        <option value="Cash">Cash</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="reference_number" class="form-label">Reference Number (if applicable)</label>
                    <input type="text" class="form-control" id="reference_number" name="reference_number">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Submit Application</button>
                    <a href="{% url 'fees_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
