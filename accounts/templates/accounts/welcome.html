{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome - HSMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body, html {
      height: 100%;
      margin: 0;
    }

    /* Background image */
    .bg {
      background-image: url("{% static 'images/hostel2.jpeg' %}");
      height: 100%;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    .topbar {
      position: absolute;
      top: 0;
      right: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .btn-login {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 5px;
      font-weight: 600;
      transition: background 0.3s ease;
      text-decoration: none;
    }

    .btn-login:hover {
      background-color: #0056b3;
      color: #fff;
    }

    .welcome-text {
      font-size: 3rem;
      font-weight: 700;
      text-align: center;
      margin-top: 50px;
    }

    .sub-text {
      font-size: 1.3rem;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="bg">
    <!-- Top-right title + login button -->
    <div class="topbar">
      <div class="d-flex align-items-center">
        <img src="{% static 'images/logo.png' %}" alt="HSMS Logo" class="rounded-circle me-2" style="width: 40px; height: 40px;">
        <span class="title">Hostel Management System</span>
      </div>
      <a href="{% url 'login' %}" class="btn-login"><i class="fas fa-sign-in-alt me-2"></i>Login</a>
    </div>

    <!-- Center text -->
    <div class="welcome-text">Welcome to HSMS</div>
    <div class="sub-text">Manage your hostel with ease</div>
  </div>
</body>
</html>
