{% extends 'base.html' %}
{% block title %}Expenses - HSMS{% endblock %}
{% block content %}
<h3>Expenses</h3>
<div class="table-responsive">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Date</th>
        <th>Item</th>
        <th>Category</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody>
      {% for e in expenses %}
      <tr>
        <td>{{ e.date }}</td>
        <td>{{ e.item }}</td>
        <td>{{ e.category }}</td>
        <td>₹ {{ e.amount }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4">No expenses.</td></tr>
      {% endfor %}
    </tbody>
    <tfoot>
      <tr>
        <th colspan="3" class="text-end">Total</th>
        <th>₹ {{ total }}</th>
      </tr>
    </tfoot>
  </table>
  </div>
{% endblock %}
